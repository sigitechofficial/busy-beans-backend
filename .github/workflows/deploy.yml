# Must exist on main (default branch) so GitHub lists workflow_dispatch.
# Branch picks the server. No environment dropdown.
# testing → testingbb + testbb
# main → backendbb + bb, only if .github/production-go-live is exactly "true"
name: Deploy BusyBeans (SSH)

on:
  push:
    branches:
      - testing
      - main
  workflow_dispatch:

concurrency:
  group: busybeans-${{ github.ref == 'refs/heads/main' && 'production' || 'testing' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main'

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: "22"
      VPS_USER: trimworldwide
      SSH_OPTS: -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes -o ConnectTimeout=30

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Resolve target from branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/testing" ]; then
            {
              echo "DEPLOY=true"
              echo "TARGET=staging"
              echo "LIVE_PATH=/home/trimworldwide/testingbb.trimworldwide.com"
              echo "APP_URL=https://testingbb.trimworldwide.com/"
              echo "PM2_APP_NAME=testbb"
              echo "ENTRY_JS=testbb.js"
              echo "DEPLOY_ROOT=/home/trimworldwide/deployments/busybeans-testing"
            } >> "$GITHUB_ENV"
            echo "Target: staging (testingbb / testbb)"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            FLAG="$(tr -d '[:space:]' < .github/production-go-live 2>/dev/null || true)"
            echo "production-go-live=${FLAG}"
            if [ "${FLAG}" != "true" ]; then
              echo "DEPLOY=false" >> "$GITHUB_ENV"
              echo "Skipping production deploy. Set .github/production-go-live to true (then push main) to go live."
              exit 0
            fi
            {
              echo "DEPLOY=true"
              echo "TARGET=production"
              echo "LIVE_PATH=/home/trimworldwide/backendbb.trimworldwide.com"
              echo "APP_URL=https://backendbb.trimworldwide.com/"
              echo "PM2_APP_NAME=bb"
              echo "ENTRY_JS=bb.js"
              echo "DEPLOY_ROOT=/home/trimworldwide/deployments/busybeans-production"
            } >> "$GITHUB_ENV"
            echo "Target: production (backendbb / bb)"
          else
            echo "Ref ${GITHUB_REF} is not allowed."
            exit 1
          fi

      - name: Configure SSH
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          VPS_PORT="${VPS_PORT:-22}"
          echo "Adding VPS host key to known_hosts..."
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 20 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Failed to add VPS host key."
            exit 1
          fi

      - name: Verify SSH and protected files
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          # shellcheck disable=SC2086
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" $SSH_OPTS "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
          set -euo pipefail
          LIVE_PATH="$LIVE_PATH"
          ENTRY_JS="$ENTRY_JS"
          ls -ld "\$LIVE_PATH"
          for f in .env config/config.json firebase.json .htaccess "\$ENTRY_JS" package.json package-lock.json; do
            if [ ! -e "\$LIVE_PATH/\$f" ]; then
              echo "Missing required file: \$LIVE_PATH/\$f"
              exit 1
            fi
            echo "PRESENT \$f"
          done
          REMOTE

      - name: Prepare backup folder and snapshot live code
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          # shellcheck disable=SC2086
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" $SSH_OPTS "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
          set -euo pipefail
          LIVE_PATH="$LIVE_PATH"
          DEPLOY_ROOT="$DEPLOY_ROOT"
          mkdir -p "\$DEPLOY_ROOT/backups" "\$DEPLOY_ROOT/logs"
          BACKUP_FILE="\$DEPLOY_ROOT/backups/pre-deploy-\$(date -u +%Y%m%d-%H%M%SZ).tar.gz"
          tar \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=config \
            --exclude=firebase.json \
            --exclude=.htaccess \
            --exclude=.well-known \
            --exclude=public \
            --exclude='*.log' \
            --exclude='*.zip' \
            -czf "\$BACKUP_FILE" \
            -C "\$LIVE_PATH" .
          ls -lh "\$BACKUP_FILE"
          ls -1t "\$DEPLOY_ROOT/backups"/*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          REMOTE

      - name: Rsync code (leave server secrets in place)
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          # shellcheck disable=SC2086
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT $SSH_OPTS" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='config' \
            --exclude='config/' \
            --exclude='firebase.json' \
            --exclude='.htaccess' \
            --exclude='.well-known' \
            --exclude='public' \
            --exclude='public/' \
            --exclude='*.log' \
            --exclude='*.zip' \
            --exclude='*.pem' \
            --exclude='*.key' \
            ./ \
            "$VPS_USER@$VPS_HOST:$LIVE_PATH/"

      - name: Install, migrate, restart PM2
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          # shellcheck disable=SC2086
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" $SSH_OPTS "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
          set -euo pipefail
          LIVE_PATH="$LIVE_PATH"
          PM2_APP_NAME="$PM2_APP_NAME"
          DEPLOY_ROOT="$DEPLOY_ROOT"

          export PATH="/bin:/usr/local/bin:/usr/bin"
          hash -r 2>/dev/null || true

          echo "node: \$(command -v node) \$(node -v)"
          echo "npm: \$(command -v npm) \$(npm -v)"
          echo "pm2 app: \$PM2_APP_NAME"
          echo "live path: \$LIVE_PATH"

          NODE_MAJOR="\$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)"
          if [ "\$NODE_MAJOR" -lt 18 ]; then
            echo "Need Node.js 18+. This SSH session has: \$(node -v 2>/dev/null || echo missing)"
            exit 1
          fi

          cd "\$LIVE_PATH"

          echo "Installing dependencies..."
          export PUPPETEER_SKIP_DOWNLOAD=true
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          npm ci

          echo "Running pending app migrations..."
          NODE_ENV=production npm run migrate

          echo "Running pending marketing migrations..."
          NODE_ENV=production npm run marketing:migrate

          echo "Restarting PM2 app \$PM2_APP_NAME with /bin/node..."
          if pm2 describe "\$PM2_APP_NAME" > /dev/null 2>&1; then
            pm2 restart "\$PM2_APP_NAME" --update-env --interpreter /bin/node
          else
            echo "PM2 process \$PM2_APP_NAME was not found."
            exit 1
          fi

          pm2 save || true
          echo "Remote deploy steps completed."
          REMOTE

      - name: Smoke check
        if: env.DEPLOY == 'true'
        run: |
          set -euo pipefail
          HTTP_CODE="000"
          ATTEMPT=1
          MAX_ATTEMPTS=12
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Smoke check $APP_URL attempt $ATTEMPT of $MAX_ATTEMPTS..."
            HTTP_CODE="$(curl -sS -L -I --max-time 20 "$APP_URL" | awk 'NR==1 {print $2}' || echo 000)"
            if [ -z "$HTTP_CODE" ]; then
              HTTP_CODE="000"
            fi
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "000" ] && [ "$HTTP_CODE" -lt 500 ]; then
              echo "Smoke check passed."
              exit 0
            fi
            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Smoke check failed after $MAX_ATTEMPTS attempts. Last code: $HTTP_CODE"
              exit 1
            fi
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done
